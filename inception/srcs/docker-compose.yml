
services:
 nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/wordpress
    networks:
      - inception
    depends_on:
      - wordpress

 wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    volumes:
      - wordpress_files:/var/www/wordpress
    networks:
      - inception
    depends_on:
      - mariadb
    env_file: .env
    secrets:
      - db_password
      - credentials
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    env_file: .env
    secrets:
      - db_password
      - db_root_password
networks:
  inception:
    driver: bridge
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/msalim/data/db

  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/msalim/data/wordpress 
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
