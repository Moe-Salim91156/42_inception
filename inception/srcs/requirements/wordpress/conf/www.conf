[www]
user  = www-data
group = www-data

; ⚠️  CRITICAL: Must listen on TCP, NOT a Unix socket
;     NGINX container connects to wordpress:9000 over the Docker network
;     A Unix socket file is local-only and unreachable from another container
listen = 0.0.0.0:9000

; Process management
pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pass environment variables into PHP
; ⚠️  Required so PHP scripts can read $_ENV or getenv()
clear_env = no
