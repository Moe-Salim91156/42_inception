# ⚠️  Replace 'yourlogin' with your actual 42 login

server {
    # ⚠️  Listen on 443 ONLY — no port 80 block
    listen      443 ssl;
    listen      [::]:443 ssl;

    # ⚠️  Must match your DOMAIN_NAME in .env
    server_name msalim.42.fr;

    # SSL certificate (generated in the Dockerfile)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ⚠️  CRITICAL: Only TLSv1.2 and TLSv1.3 are allowed
    #     TLSv1.0 and TLSv1.1 are explicitly forbidden by the subject
    ssl_protocols TLSv1.2 TLSv1.3;

    # Recommended SSL settings
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # WordPress web root
    root  /var/www/wordpress;
    index index.php index.html;

    # Serve files directly, fall back to WordPress index for routing
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ──────────────────────────────────────────────
    # PHP handling — pass to WordPress container
    # ⚠️  fastcgi_pass uses the SERVICE NAME 'wordpress' (Docker internal DNS)
    #     and port 9000 (TCP, as configured in www.conf)
    # ──────────────────────────────────────────────
    location ~ \.php$ {
        # Security: only process existing files
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # ⚠️  'wordpress' resolves to the WordPress container via Docker network
        fastcgi_pass  wordpress:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # ⚠️  SCRIPT_FILENAME must point to the file INSIDE the wordpress container
        #     Both containers share the same volume mounted at /var/www/wordpress
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
    }

    # Block access to sensitive files
    location ~ /\.ht {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
